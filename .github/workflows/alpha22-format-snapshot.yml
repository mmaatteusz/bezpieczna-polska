name: Alpha22 temporary formatter diff
on:
  push:
    branches:
      - stage/alpha22-android-gui-wczk

jobs:
  format-diff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - name: Format target files and print diff
        run: |
          dart format mobile/lib/main.dart mobile/lib/screens/dashboard_screen.dart mobile/lib/screens/more_screen.dart mobile/lib/ui/safety_event_card.dart
          git diff -- mobile/lib/main.dart mobile/lib/screens/dashboard_screen.dart mobile/lib/screens/more_screen.dart mobile/lib/ui/safety_event_card.dart
