name: Publish Android beta

on:
  workflow_run:
    workflows: [Build preview APK and offline regression]
    types: [completed]
  workflow_dispatch:
    inputs:
      target_sha:
        description: Exact main commit already tested by preview regression
        required: true
        type: string
      regression_run_id:
        description: Successful main push regression run for this SHA
        required: true
        type: string
      release_mode:
        description: Resume after manual Oracle deployment, or publish an Android-only test release
        required: true
        type: choice
        default: verified-backend
        options: [verified-backend, testing-apk]
      build_play_bundle:
        description: Also build a signed production AAB for Google Play testing
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: android-beta-release
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       (contains(github.event.workflow_run.head_commit.message, '[release-beta]') ||
        contains(github.event.workflow_run.head_commit.message, '[release-beta-test]')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.identity.outputs.sha }}
      version: ${{ steps.identity.outputs.version }}
      run_id: ${{ steps.identity.outputs.run_id }}
      mode: ${{ steps.identity.outputs.mode }}
      play_bundle: ${{ steps.identity.outputs.play_bundle }}
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ inputs.target_sha || github.event.workflow_run.head_sha }}
      REGRESSION_RUN_ID: ${{ inputs.regression_run_id || github.event.workflow_run.id }}
      RELEASE_MODE: ${{ inputs.release_mode || (contains(github.event.workflow_run.head_commit.message, '[release-beta-test]') && 'testing-apk') || 'deploy' }}
      PLAY_BUNDLE: ${{ inputs.build_play_bundle || contains(github.event.workflow_run.head_commit.message, '[release-play-bundle]') }}
    steps:
      - name: Validate requested identifiers before checkout
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$REGRESSION_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          [[ "$RELEASE_MODE" == 'deploy' || "$RELEASE_MODE" == 'verified-backend' || "$RELEASE_MODE" == 'testing-apk' ]]
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.target_sha || github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - name: Validate beta identity and notes
        id: identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          if [[ "$GITHUB_EVENT_NAME" == 'workflow_run' ]]; then
            test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          fi
          VERSION="$(node -p "require('./backend/package.json').version")"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]
          test -s "docs/releases/${VERSION}.md"
          node scripts/sync-mobile-version.mjs --check
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "run_id=$REGRESSION_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"
          echo "play_bundle=$PLAY_BUNDLE" >> "$GITHUB_OUTPUT"
      - name: Require a successful trusted regression for the exact main SHA
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${REGRESSION_RUN_ID}" > regression-run.json
          jq -e --arg sha "$RELEASE_SHA" --arg repo "$GITHUB_REPOSITORY" \
            '.conclusion == "success" and .event == "push" and .head_branch == "main" and
             .head_sha == $sha and .head_repository.full_name == $repo and
             .path == ".github/workflows/regression-preview.yml"' regression-run.json
      - name: Require successful infrastructure gate for the same main SHA
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 75); do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/production-release.yml/runs?head_sha=${RELEASE_SHA}&event=push&per_page=20")"
            if jq -e '.workflow_runs | any(.conclusion == "success")' <<<"$result" > /dev/null; then
              exit 0
            fi
            if jq -e '.workflow_runs | length > 0 and all(.status == "completed")' <<<"$result" > /dev/null; then
              echo 'Infrastructure gate failed; beta will not be deployed or published.' >&2
              exit 1
            fi
            sleep 20
          done
          echo 'Timed out waiting for the infrastructure gate.' >&2
          exit 1

  deploy:
    needs: verify
    if: needs.verify.outputs.mode == 'deploy'
    uses: ./.github/workflows/oracle-deploy.yml
    with:
      target_sha: ${{ needs.verify.outputs.sha }}
      api_base_url: https://bezpieczna-polska-api.duckdns.org
    secrets: inherit

  runtime:
    needs: [verify, deploy]
    if: >-
      always() && needs.verify.result == 'success' &&
      (needs.verify.outputs.mode != 'deploy' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      backend_sha: ${{ steps.health.outputs.backend_sha }}
      backend_version: ${{ steps.health.outputs.backend_version }}
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      VERSION: ${{ needs.verify.outputs.version }}
      RELEASE_MODE: ${{ needs.verify.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Verify live backend and record deployment status
        id: health
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 15 https://bezpieczna-polska-api.duckdns.org/health > health.json
          curl -fsS --max-time 15 https://bezpieczna-polska-api.duckdns.org/ready > ready.json
          jq -e '.ok == true and .environment == "production" and
            (.buildSha | test("^[a-f0-9]{40}$")) and (.version | type == "string")' health.json
          jq -e '.ready == true and .database == "postgres" and .postgis == true' ready.json
          if [[ "$RELEASE_MODE" != 'testing-apk' ]]; then
            jq -e --arg sha "$RELEASE_SHA" --arg version "$VERSION" \
              '.buildSha == $sha and .version == $version' health.json
          fi
          echo "backend_sha=$(jq -r .buildSha health.json)" >> "$GITHUB_OUTPUT"
          echo "backend_version=$(jq -r .version health.json)" >> "$GITHUB_OUTPUT"
      - name: Verify full live API contracts
        working-directory: backend
        env:
          SMOKE_BASE_URL: https://bezpieczna-polska-api.duckdns.org
          EXPECTED_BUILD_SHA: ${{ steps.health.outputs.backend_sha }}
          EXPECTED_VERSION: ${{ steps.health.outputs.backend_version }}
          AUDIT_MODE: health
          DEPLOY_WAIT_SECONDS: '60'
          SOURCE_WAIT_SECONDS: '60'
        run: node scripts/production-runtime-smoke.mjs

  play-bundle:
    needs: [verify, runtime]
    if: >-
      always() && needs.verify.result == 'success' && needs.runtime.result == 'success' &&
      needs.verify.outputs.play_bundle == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BP_ENV: production
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      VERSION: ${{ needs.verify.outputs.version }}
      API_BASE_URL: https://bezpieczna-polska-api.duckdns.org
      BACKEND_SHA: ${{ needs.runtime.outputs.backend_sha }}
      BACKEND_VERSION: ${{ needs.runtime.outputs.backend_version }}
      PRIVACY_POLICY_URL: ${{ vars.PRIVACY_POLICY_URL }}
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PRODUCTION_SIGNING_CERT_SHA256: ${{ vars.PRODUCTION_SIGNING_CERT_SHA256 }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_PRODUCTION_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          fetch-depth: 0
      - name: Require existing production signing, Firebase and privacy configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PRODUCTION_SIGNING_CERT_SHA256 FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_ANDROID_APP_ID PRIVACY_POLICY_URL; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing production configuration: $key"; missing=1; fi
          done
          test "$missing" = 0
          [[ "$PRODUCTION_SIGNING_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$FIREBASE_ANDROID_APP_ID" == "1:${FIREBASE_MESSAGING_SENDER_ID}:android:"* ]]
          [[ "$FIREBASE_ANDROID_APP_ID" != '1:286214663598:android:3d9689cd9f636399ffac3f' ]]
          [[ "$PRIVACY_POLICY_URL" == https://* ]]
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 20 \
            --output "$RUNNER_TEMP/privacy.html" --write-out '%{content_type}' \
            "$PRIVACY_POLICY_URL" > "$RUNNER_TEMP/privacy-type.txt"
          grep -Eiq '^text/html([;[:space:]]|$)' "$RUNNER_TEMP/privacy-type.txt"
          test -s "$RUNNER_TEMP/privacy.html"
          if grep -Fq '[DO UZUPEŁNIENIA' "$RUNNER_TEMP/privacy.html"; then
            echo '::error::Privacy policy still contains unfilled draft fields.'; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify release identity and monotonic production version code
        run: |
          node scripts/sync-mobile-version.mjs --check
          node scripts/check-production-version-history.mjs
          BUILD="$(sed -nE 's/^version: [^+]+\+([0-9]+)$/\1/p' mobile/pubspec.yaml)"
          test -n "$BUILD"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install and verify the existing production key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          cert="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test "$cert" = "$PRODUCTION_SIGNING_CERT_SHA256"
      - name: Build signed Play test bundle against the verified live backend
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$API_BASE_URL/health")"
          jq -e --arg sha "$BACKEND_SHA" --arg version "$BACKEND_VERSION" \
            '.ok == true and .environment == "production" and .buildSha == $sha and .version == $version' <<<"$health"
          # A client-only beta may use an older compatible, contract-tested API.
          # The normal production release gate still requires an exact version.
          test "${BACKEND_VERSION%%-*}" = "${VERSION%%-*}"
          flutter pub get
          flutter build appbundle --release \
            --dart-define=APP_ENV=production --dart-define="APP_VERSION=$VERSION" \
            --dart-define=APP_CHANNEL=production --dart-define="APP_BUILD_NUMBER=$BUILD" \
            --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define=ENABLE_DEVELOPER_SETTINGS=false \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
      - name: Verify AAB signature, structure and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir play
          cp mobile/build/app/outputs/bundle/release/app-release.aab "play/Bezpieczna_Polska_${VERSION}_Google_Play.aab"
          jarsigner -verify -strict -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD play/*.aab "$ANDROID_KEY_ALIAS" | tee play/aab-signature-check.txt
          curl -fsSL --max-time 60 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="play/Bezpieczna_Polska_${VERSION}_Google_Play.aab" > play/aab-validation.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="play/Bezpieczna_Polska_${VERSION}_Google_Play.aab" > play/aab-manifest.xml
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('play/aab-manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package'] == 'pl.bezpiecznapolska'
          assert root.attrib[android + 'versionName'] == os.environ['VERSION']
          assert root.attrib[android + 'versionCode'] == os.environ['BUILD']
          assert root.find('uses-sdk').attrib[android + 'targetSdkVersion'] == '36'
          PY
          printf 'Package: pl.bezpiecznapolska\nVersion: %s\nSource commit: %s\nBackend: %s (%s)\nSigner SHA256: %s\nFirebase Android app: %s\nPrivacy policy: %s\n' \
            "$VERSION" "$RELEASE_SHA" "$BACKEND_VERSION" "$BACKEND_SHA" "$PRODUCTION_SIGNING_CERT_SHA256" "$FIREBASE_ANDROID_APP_ID" "$PRIVACY_POLICY_URL" > play/play-build-info.txt
          (cd play && sha256sum *.aab > AAB_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: Bezpieczna_Polska_Play_bundle
          path: play/
          if-no-files-found: error
      - name: Remove temporary production key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

  publish:
    needs: [verify, deploy, runtime, play-bundle]
    if: >-
      always() && needs.verify.result == 'success' && needs.runtime.result == 'success' &&
      (needs.verify.outputs.mode != 'deploy' || needs.deploy.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      VERSION: ${{ needs.verify.outputs.version }}
      VERIFIED_RUN_ID: ${{ needs.verify.outputs.run_id }}
      RELEASE_MODE: ${{ needs.verify.outputs.mode }}
      BACKEND_SHA: ${{ needs.runtime.outputs.backend_sha }}
      BACKEND_VERSION: ${{ needs.runtime.outputs.backend_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
      - name: Download the exact APK tested by the successful regression run
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$VERIFIED_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name Bezpieczna_Polska_preview_offline_regression --dir verified
          test -s "verified/Bezpieczna_Polska_${VERSION}-preview-arm64.apk"
          (cd verified && sed 's@  output/@  @' SHA256SUMS.txt | sha256sum --check)
          grep -F "versionName='${VERSION}'" verified/package-info.txt
          grep -F "name='pl.bezpiecznapolska.preview'" verified/package-info.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" verified/signature-check.txt
          mkdir release
          cp "verified/Bezpieczna_Polska_${VERSION}-preview-arm64.apk" "release/Bezpieczna_Polska_${VERSION}_arm64.apk"
          cp verified/package-info.txt verified/signature-check.txt release/
          (cd release && sha256sum *.apk > SHA256SUMS.txt)
      - name: Add the verified Play bundle when available
        if: needs.play-bundle.result == 'success'
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name Bezpieczna_Polska_Play_bundle --dir play
          (cd play && sha256sum --check AAB_SHA256SUMS.txt)
          cp play/* release/
          (cd release && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Publish exact tested APK with explicit backend status
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 15 https://bezpieczna-polska-api.duckdns.org/health)"
          jq -e --arg sha "$BACKEND_SHA" --arg version "$BACKEND_VERSION" \
            '.ok == true and .buildSha == $sha and .version == $version and .environment == "production"' <<<"$health"
          cp "docs/releases/${VERSION}.md" release-notes.md
          TITLE="Bezpieczna Polska ${VERSION}"
          if [[ '${{ needs.verify.outputs.play_bundle }}' == 'true' && '${{ needs.play-bundle.result }}' != 'success' ]]; then
            printf '\n## Pakiet Google Play\n\nBuild podpisanego AAB nie zakończył się pomyślnie. To wydanie zawiera wyłącznie APK preview; nie używaj go jako pakietu Google Play. Sprawdź błędy zadania play-bundle w workflow publikacji.\n' >> release-notes.md
          fi
          if [[ "$RELEASE_MODE" == 'testing-apk' ]]; then
            TITLE="${TITLE} — testy Androida"
            printf '\n## Stan backendu podczas publikacji\n\nWydanie testowe APK. Backend Oracle działa na `%s` (commit `%s`). Publikacja APK nie wdraża backendu. Poprawki serwerowe opisane jako oczekujące wymagają osobnego wdrożenia.\n' \
              "$BACKEND_VERSION" "$BACKEND_SHA" >> release-notes.md
          fi
          printf '\nCommit: `%s`\n\nRegresja APK: https://github.com/%s/actions/runs/%s\n' \
            "$RELEASE_SHA" "$GITHUB_REPOSITORY" "$VERIFIED_RUN_ID" >> release-notes.md
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo 'This beta already exists; refusing to overwrite its artifacts.' >&2
            exit 1
          fi
          gh release create "v${VERSION}" release/* --repo "$GITHUB_REPOSITORY" \
            --target "$RELEASE_SHA" --prerelease --title "$TITLE" \
            --notes-file release-notes.md
