name: Audit Oracle candidate host

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: HTTPS origin of the parallel Oracle API
        required: false
        type: string

permissions:
  contents: read

jobs:
  host-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_BASE_URL: ${{ inputs.api_base_url }}
      ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_SSH_KNOWN_HOSTS: ${{ secrets.ORACLE_SSH_KNOWN_HOSTS }}
    steps:
      - name: Require SSH audit secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in ORACLE_SSH_HOST ORACLE_SSH_USER ORACLE_SSH_PRIVATE_KEY ORACLE_SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "Missing GitHub secret: $name" >&2; exit 1; }
          done

      - name: Configure pinned SSH trust
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$ORACLE_SSH_PRIVATE_KEY" > ~/.ssh/oracle
          chmod 0600 ~/.ssh/oracle
          printf '%s\n' "$ORACLE_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/known_hosts

      - name: Run host audit
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/oracle -o BatchMode=yes -o StrictHostKeyChecking=yes             "${ORACLE_SSH_USER}@${ORACLE_SSH_HOST}"             'sudo /usr/local/sbin/bp-oracle-audit'

      - name: Verify external candidate endpoint
        if: inputs.api_base_url != ''
        shell: bash
        run: |
          set -euo pipefail
          [[ "$API_BASE_URL" =~ ^https://[^/]+/?$ ]] || { echo 'api_base_url must be a public HTTPS origin' >&2; exit 1; }
          BASE="${API_BASE_URL%/}"
          curl --fail --silent --show-error --max-time 10 "${BASE}/health" | jq
          curl --fail --silent --show-error --max-time 10 "${BASE}/ready" | jq -e '.ready == true and .database == "postgres" and .postgis == true'
