name: Audit production runtime

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
  deployment_status:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Optional deployed commit SHA to require
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: audit-production-runtime-${{ github.event.deployment.sha || github.sha || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name != 'deployment_status' ||
      github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.deployment.sha || github.event.inputs.expected_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate runtime smoke client
        working-directory: backend
        run: node --check scripts/production-runtime-smoke.mjs
      - name: Require configured production API
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || vars.API_BASE_URL }}
        run: |
          test -n "$SMOKE_BASE_URL" || { echo 'PRODUCTION_API_BASE_URL or API_BASE_URL repository variable is required' >&2; exit 1; }
      - name: Probe deployed production
        working-directory: backend
        env:
          SMOKE_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL || vars.API_BASE_URL }}
          EXPECTED_BUILD_SHA: ${{ github.event.deployment.sha || (github.event_name == 'push' && github.sha) || github.event.inputs.expected_sha || '' }}
          DEPLOY_WAIT_SECONDS: '600'
          SOURCE_WAIT_SECONDS: '240'
          # Keep the critical-source list in the smoke client as the single source of truth.
          ALLOW_STALE_SOURCE_IDS: SHELTERS
        run: node scripts/production-runtime-smoke.mjs
