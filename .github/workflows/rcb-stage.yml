name: Verify RCB stage
on:
  push:
    branches: [stage/rcb-live]
  pull_request:
permissions:
  contents: read
concurrency:
  group: rcb-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U test -d test'
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      TEST_DATABASE_URL: postgresql://test:disposable_ci_only@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - name: Apply verified first-stage changes
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          if [ -f rcb-stage.patch ]; then
            echo 'f7b52248a464f037048b799bb243639e149a1a3fbeeb3c2312d928441b21ea23  rcb-stage.patch' | sha256sum --check
            git apply --index rcb-stage.patch
            git rm rcb-stage.patch
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend and real PostGIS tests
        working-directory: backend
        run: npm ci && npm run build && npm test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Mobile verification
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/main.dart lib/model.dart test/model_test.dart test/widget_test.dart
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Fetch real RCB publications into PostGIS
        working-directory: backend
        run: node scripts/live-rcb.mjs ../docs/validation/rcb
      - name: Persist tested source and live observation
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          git add backend mobile docs deploy scripts sources README.md compose.yaml
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Apply tested RCB stage with live data observation'
            git push origin "HEAD:$BRANCH_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: rcb-live-validation
          path: docs/validation/rcb/rcb-live.json
          if-no-files-found: error
          retention-days: 30
