name: Build installable test APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  BP_ENV: preview
  PREVIEW_API_BASE_URL: https://api-production-b6560.up.railway.app

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Build current main-compatible preview APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug --split-per-abi --target-platform android-arm64 \
            --dart-define=APP_ENV=preview \
            --dart-define="API_BASE_URL=$PREVIEW_API_BASE_URL" \
            --dart-define=ENABLE_DEVELOPER_SETTINGS=true
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          VERSION="$(node -p "require('./backend/package.json').version")"
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "output/Bezpieczna_Polska_${VERSION}-test-arm64.apk"
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bezpieczna_Polska_test_apk
          path: output/
          if-no-files-found: error
          retention-days: 7
