name: Build installable test APK

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  BP_ENV: preview
  PREVIEW_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL || vars.PRODUCTION_API_BASE_URL }}
  ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
  ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
  ANDROID_PREVIEW_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
  ANDROID_PREVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Require configured preview API
        run: |
          test -n "$PREVIEW_API_BASE_URL" || { echo 'PREVIEW_API_BASE_URL or PRODUCTION_API_BASE_URL repository variable is required' >&2; exit 1; }
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Configure stable preview signing
        run: bash scripts/configure-preview-signing.sh
      - name: Allocate preview version identity
        shell: bash
        run: |
          set -euo pipefail
          echo "PREVIEW_BUILD_NUMBER=$(bash scripts/android-preview-build-number.sh)" >> "$GITHUB_ENV"
          echo "PREVIEW_DISPLAY_BUILD=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          VERSION="$(sed -nE 's/^version: ([^+]+)\+[0-9]+$/\1/p' mobile/pubspec.yaml)"
          test -n "$VERSION"
          echo "APP_RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"
      - name: Build current main-compatible preview APK
        working-directory: mobile
        run: |
          flutter pub get
          flutter build apk --debug --split-per-abi --target-platform android-arm64 --build-number="$PREVIEW_BUILD_NUMBER" \
            --dart-define=APP_ENV=preview \
            --dart-define="APP_VERSION=$APP_RELEASE_VERSION" \
            --dart-define="APP_BUILD_NUMBER=$PREVIEW_DISPLAY_BUILD" \
            --dart-define=APP_CHANNEL=preview \
            --dart-define="API_BASE_URL=$PREVIEW_API_BASE_URL" \
            --dart-define=ENABLE_DEVELOPER_SETTINGS=true
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          VERSION="$(node -p "require('./backend/package.json').version")"
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "output/Bezpieczna_Polska_${VERSION}-test-arm64.apk"
          bash scripts/verify-preview-apk.sh $(find output -maxdepth 1 -name '*.apk' -print -quit) "$PREVIEW_BUILD_NUMBER" split-arm64
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs output/*.apk | tee output/signature-check.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/*.apk > output/package-info.txt
          grep -F "name='pl.bezpiecznapolska.preview'" output/package-info.txt
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bezpieczna_Polska_test_apk
          path: output/
          if-no-files-found: error
          retention-days: 7
