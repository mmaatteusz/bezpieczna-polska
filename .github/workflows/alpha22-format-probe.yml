name: Alpha22 format probe
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/alpha22-format-probe.yml'
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Show formatter patch
        working-directory: mobile
        shell: bash
        run: |
          cp lib/main.dart /tmp/main.dart
          cp lib/screens/dashboard_screen.dart /tmp/dashboard_screen.dart
          cp lib/screens/more_screen.dart /tmp/more_screen.dart
          cp lib/ui/safety_event_card.dart /tmp/safety_event_card.dart
          dart format lib/main.dart lib/screens/dashboard_screen.dart lib/screens/more_screen.dart lib/ui/safety_event_card.dart
          echo '---MAIN---'
          diff -u /tmp/main.dart lib/main.dart || true
          echo '---DASHBOARD---'
          diff -u /tmp/dashboard_screen.dart lib/screens/dashboard_screen.dart || true
          echo '---MORE---'
          diff -u /tmp/more_screen.dart lib/screens/more_screen.dart || true
          echo '---CARD---'
          diff -u /tmp/safety_event_card.dart lib/ui/safety_event_card.dart || true
          echo '---END---'
