name: Temporary Dart 3.47.4 radiation format probe
on:
  push:
    branches:
      - stage/paa-measurements
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Format radiation test
        working-directory: mobile
        run: |
          flutter pub get
          dart format test/radiation_test.dart
          git diff -- test/radiation_test.dart
