name: Build connected preview Android APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: backend
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Require a deployed and synchronized backend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node scripts/check-backend.mjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - run: flutter analyze --no-pub && flutter test --no-pub
        working-directory: mobile
      - name: Build with backend from repository build configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --no-pub --debug --split-per-abi --target-platform android-arm64 --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define=ENABLE_DEVELOPER_SETTINGS=false
        working-directory: mobile
      - name: Verify APK and prepare download
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || sdkmanager 'build-tools;36.0.0'
          mkdir -p output
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk output/Bezpieczna_Polska_0.1.0-alpha.16-preview-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose output/*.apk | tee output/signature-check.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/*.apk > output/package-info.txt
          cd output
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bezpieczna_Polska_0.1.0-alpha.16-preview-arm64
          path: output/
          if-no-files-found: error
          retention-days: 30
