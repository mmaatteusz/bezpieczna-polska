name: Build connected preview Android APK (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  BP_ENV: preview
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci && npm run build && npm test
        working-directory: backend
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: verify
    env:
      ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
      ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
      ANDROID_PREVIEW_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
      ANDROID_PREVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Require a deployed and synchronized backend
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: node scripts/check-backend.mjs
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: mobile
      - name: Configure stable preview signing
        run: bash scripts/configure-preview-signing.sh
      - run: flutter analyze --no-pub && flutter test --no-pub
        working-directory: mobile
      - name: Build with backend from repository build configuration
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: flutter build apk --no-pub --debug --split-per-abi --target-platform android-arm64 --dart-define=APP_ENV=preview --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define=ENABLE_DEVELOPER_SETTINGS=false
        working-directory: mobile
      - name: Verify APK and prepare download
        shell: bash
        run: |
          set -euo pipefail
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner" || sdkmanager 'build-tools;36.0.0'
          mkdir -p output
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk output/Bezpieczna_Polska_preview_arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs output/*.apk | tee output/signature-check.txt
          grep -F "Signer #1 certificate SHA-256 digest: 1f7f3f2aea7073889563b7461e7dfd8f80929a36fff8138c51a2a9516db153d2" output/signature-check.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/*.apk > output/package-info.txt
          cd output
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bezpieczna_Polska_preview_arm64
          path: output/
          if-no-files-found: error
          retention-days: 30
