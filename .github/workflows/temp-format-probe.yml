name: TEMP Dart format probe

on:
  pull_request:
    branches: [main]

jobs:
  format-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - name: Print Dart formatter diff
        working-directory: mobile
        run: |
          dart format lib test
          git diff -- lib/screens/alerts_screen.dart lib/ui/safety_event_card.dart test/start_alert_regression_test.dart
          test -z "$(git diff --name-only -- lib/screens/alerts_screen.dart lib/ui/safety_event_card.dart test/start_alert_regression_test.dart)"
