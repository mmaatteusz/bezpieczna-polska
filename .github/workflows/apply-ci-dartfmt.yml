name: Apply CI dart format
on:
  pull_request:
    branches: [main]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve dependencies and apply CI formatter
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/shelter_map.dart
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/shelter_map.dart
          if git diff --cached --quiet; then
            echo "Already formatted"
          else
            git commit -m "Apply CI dart format"
            git push origin "HEAD:${{ github.head_ref }}"
          fi
