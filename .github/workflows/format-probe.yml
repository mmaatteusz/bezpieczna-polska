name: Temporary full Dart format probe
on:
  push:
    branches: [stage/startup-loading-copy]
permissions:
  contents: read
jobs:
  format-probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Match CI package configuration
        working-directory: mobile
        run: flutter pub get
      - name: Show exact formatter diff
        working-directory: mobile
        run: |
          dart format lib test
          git diff -- lib test
