name: Format probe

on:
  pull_request:
    paths:
      - 'mobile/lib/shelter_map.dart'
      - '.github/workflows/format-probe.yml'

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true
      - name: Show formatter diff
        working-directory: mobile
        run: |
          dart format lib/shelter_map.dart
          git diff -- lib/shelter_map.dart
