name: Temporary Dart format probe
on:
  push:
    branches: [stage/startup-loading-copy]
permissions:
  contents: read
jobs:
  format-probe:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show exact formatter diff
        run: |
          dart format mobile/lib/main.dart mobile/lib/ui/brand_splash.dart mobile/test/brand_splash_test.dart
          git diff -- mobile/lib/main.dart mobile/lib/ui/brand_splash.dart mobile/test/brand_splash_test.dart
