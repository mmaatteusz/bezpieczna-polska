name: Format national map hotfix

on:
  push:
    branches:
      - hotfix/national-alert-map-markers

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/national-alert-map-markers
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format changed Dart files
        run: |
          cd mobile
          dart format lib/map_layers.dart lib/shelter_map.dart test/map_layers_test.dart
          cd ..
          if git diff --quiet -- mobile; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile
          git commit -m "Format national alert map hotfix"
          git push
