name: Probe official cyber feeds
on:
  push:
    branches: [stage/cert-csirt]
    paths: ['.github/workflows/probe-cyber.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe CERT Polska and CSIRT GOV public feed links
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re, urllib.request
          urls=['https://moje.cert.pl/komunikaty/','https://www.csirt.gov.pl/cer/rss']
          for url in urls:
              req=urllib.request.Request(url,headers={'User-Agent':'BezpiecznaPolska-source-contract-probe/0.1','Accept':'text/html,application/xml;q=0.9,*/*;q=0.1'})
              with urllib.request.urlopen(req,timeout=20) as r:
                  raw=r.read(2_000_000)
                  text=raw.decode('utf-8','replace')
                  print('\n===',url,'status',r.status,'final',r.geturl(),'content-type',r.headers.get('content-type'),'bytes',len(raw),'===')
                  hrefs=re.findall(r'''(?:href|src)=["']([^"']+)["']''',text,re.I)
                  for h in hrefs:
                      if re.search(r'rss|feed|xml',h,re.I):
                          print(h)
                  print('RSS-like absolute strings:')
                  for h in sorted(set(re.findall(r'https?://[^"\'<> ]+',text))):
                      if re.search(r'rss|feed|xml',h,re.I):
                          print(h[:500])
          PY
