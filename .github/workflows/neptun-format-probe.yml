name: NEPTUN Dart format probe
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show canonical formatting
        working-directory: mobile
        run: |
          dart format lib/neptun.dart test/neptun_test.dart
          git diff -- lib/neptun.dart test/neptun_test.dart
          git diff --exit-code -- lib/neptun.dart test/neptun_test.dart
