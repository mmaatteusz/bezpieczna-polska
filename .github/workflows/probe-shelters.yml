name: Probe official shelter data
on:
  push:
    branches: [stage/quality-pass]
    paths: ['.github/workflows/probe-shelters.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe dane.gov.pl tabular fallback
        shell: bash
        run: |
          set -euo pipefail
          echo '===== TABULAR HEADERS ====='
          curl --silent --show-error --head --max-time 30 \
            --header 'Accept: application/json' \
            --user-agent 'BezpiecznaPolska/0.1 official-open-data-check' \
            'https://api.dane.gov.pl/1.4/resources/1393918/data'
          echo '===== SMALL QUERY METADATA ====='
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header 'Accept: application/json' \
            --user-agent 'BezpiecznaPolska/0.1 official-open-data-check' \
            'https://api.dane.gov.pl/1.4/resources/1393918/data?page=1&page_size=10' \
            -o table.json
          python3 - <<'PY'
          import json, os
          d=json.load(open('table.json'))
          print('bytes=',os.path.getsize('table.json'))
          print('rows=',len(d.get('data',[])))
          print('count=',d.get('meta',{}).get('count'))
          print('params=',d.get('meta',{}).get('params'))
          print('links=',d.get('links'))
          rows=d.get('data',[])
          if rows:
              print('first_updated=',rows[0].get('meta',{}).get('updated_at'))
              print('first_id=',rows[0].get('attributes',{}).get('col1',{}).get('val'))
          PY
