name: Probe official shelter data
on:
  push:
    branches: [stage/quality-pass]
    paths: ['.github/workflows/probe-shelters.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: List official archived shelter package
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.dane.gov.pl/datasets/28058,punkty-schronienia-w-polsce/resources/files/download'
          curl --fail-with-body --silent --show-error --max-time 120 \
            --user-agent 'BezpiecznaPolska/0.1 official-open-data-check' \
            "$url" -o shelters.zip
          sha256sum shelters.zip
          unzip -l shelters.zip
