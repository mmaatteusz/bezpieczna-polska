name: Probe official shelter data
on:
  push:
    branches: [stage/quality-pass]
    paths: ['.github/workflows/probe-shelters.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe dane.gov.pl archived official resource package
        shell: bash
        run: |
          set -euo pipefail
          url='https://api.dane.gov.pl/datasets/28058,punkty-schronienia-w-polsce/resources/files/download'
          echo '===== HEAD / REDIRECT ====='
          curl --silent --show-error --head --location --max-time 30 \
            --user-agent 'BezpiecznaPolska/0.1 official-open-data-check' \
            --write-out '\nFINAL_URL=%{url_effective}\nHTTP=%{http_code}\nTYPE=%{content_type}\n' \
            "$url"
          echo '===== FIRST 4 KiB ====='
          curl --fail-with-body --silent --show-error --location --max-time 60 \
            --range 0-4095 \
            --user-agent 'BezpiecznaPolska/0.1 official-open-data-check' \
            "$url" -o archive-prefix.bin
          wc -c archive-prefix.bin
          file archive-prefix.bin
          python3 - <<'PY'
          b=open('archive-prefix.bin','rb').read(64)
          print(repr(b))
          PY
