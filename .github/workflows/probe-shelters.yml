name: Probe official shelter data
on:
  push:
    branches: [stage/quality-pass]
    paths: ['.github/workflows/probe-shelters.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe dane.gov.pl tabular page size
        shell: bash
        run: |
          set -euo pipefail
          for size in 100 500 1000 5000; do
            echo "===== page_size=$size ====="
            curl --fail-with-body --silent --show-error --max-time 60 \
              --header 'Accept: application/json' \
              --user-agent 'BezpiecznaPolska/0.1 official-open-data-check' \
              "https://api.dane.gov.pl/1.4/resources/1393918/data?page=1&page_size=$size" \
              -o table.json
            SIZE="$size" python3 - <<'PY'
          import json, os
          d=json.load(open('table.json'))
          print('requested=',os.environ['SIZE'],'bytes=',os.path.getsize('table.json'),'rows=',len(d.get('data',[])),'count=',d.get('meta',{}).get('count'),'links=',d.get('links'))
          PY
          done
