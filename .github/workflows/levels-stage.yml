name: Build security-levels preview APK
on:
  push:
    branches: [stage/security-levels]
    paths: ['.github/workflows/levels-stage.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-apk-security-levels
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter dependencies, analyze and tests
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Build Android preview
        working-directory: mobile
        run: flutter build apk --debug --target-platform android-arm64 --dart-define=ENABLE_DEVELOPER_SETTINGS=true
      - name: Prepare preview artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk output/Bezpieczna_Polska_0.1.0-alpha.3-preview-arm64.apk
          sha256sum output/*.apk > output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Bezpieczna_Polska_0.1.0-alpha.3-preview-arm64
          path: output/
          if-no-files-found: error
          retention-days: 30
