name: Verify security levels stage
on:
  push:
    branches: [stage/security-levels]
    paths: ['levels-stage.tar.gz']
permissions:
  contents: write
concurrency:
  group: levels-import
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:disposable_ci_only@localhost:5432/test
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Apply reviewed source package
        run: |
          echo '5e3bf294e3642ef324147d441236ec974c4952b45a206f5836b1516eeaa88e3f  levels-stage.tar.gz' | sha256sum -c -
          tar -xzf levels-stage.tar.gz
          rm -f mobile/lib/safety_map.dart mobile/assets/europe.geojson mobile/test/goldens/map.png
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Backend and PostGIS
        working-directory: backend
        run: npm ci && npm run build && npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter analyze and tests
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          dart fix --apply
          dart format lib test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Android native MapLibre compilation
        working-directory: mobile
        run: chmod +x android/gradlew && flutter build apk --debug --target-platform android-arm64 --dart-define=ENABLE_DEVELOPER_SETTINGS=false
      - name: Live security levels
        working-directory: backend
        run: node scripts/live-levels.mjs ../docs/validation/levels-ci
      - name: Save verified implementation
        run: |
          rm levels-stage.tar.gz
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend mobile docs scripts .github levels-stage.tar.gz
          git commit -m 'Add tested MapLibre viewport queries, clustering and bounded offline cache'
          git push origin HEAD:stage/security-levels
