name: Temporary Dart 3.47.4 format probe
on:
  push:
    branches:
      - stage/paa-measurements
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show formatter diff
        working-directory: mobile
        run: |
          dart format lib/shelter_map.dart
          git diff -- lib/shelter_map.dart
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-shelter-map-3474
          path: mobile/lib/shelter_map.dart
          retention-days: 1
