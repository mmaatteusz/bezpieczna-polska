name: Temporary Dart format probe
on:
  push:
    branches:
      - stage/paa-measurements
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Show formatter diff
        working-directory: mobile
        run: |
          dart format lib/shelter_map.dart
          git diff -- lib/shelter_map.dart
      - uses: actions/upload-artifact@v7
        with:
          name: formatted-shelter-map
          path: mobile/lib/shelter_map.dart
          retention-days: 1
