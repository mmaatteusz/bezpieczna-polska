name: Generate approved logo assets
on:
  push:
    branches: [stage/full-logo-rollout]
permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/full-logo-rollout
      - name: Install image tooling
        run: python3 -m pip install --quiet pillow
      - name: Rebuild platform logo assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          root = Path(".")
          src = Image.open(
              root / "mobile/assets/brand/bezpieczna_polska_logo.jpg"
          ).convert("RGB")

          def square(size):
              return src.resize((size, size), Image.Resampling.LANCZOS)

          android = root / "mobile/android/app/src/main/res"
          for folder, size in {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }.items():
              path = android / folder / "ic_launcher.png"
              path.parent.mkdir(parents=True, exist_ok=True)
              square(size).save(path, "PNG", optimize=True)

          splash_dir = android / "drawable-nodpi"
          splash_dir.mkdir(parents=True, exist_ok=True)
          square(320).save(
              splash_dir / "brand_logo_splash.png",
              "PNG",
              optimize=True,
          )

          ios = root / "mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset"
          icon_sizes = {
              "Icon-App-20x20@1x.png": 20,
              "Icon-App-20x20@2x.png": 40,
              "Icon-App-20x20@3x.png": 60,
              "Icon-App-29x29@1x.png": 29,
              "Icon-App-29x29@2x.png": 58,
              "Icon-App-29x29@3x.png": 87,
              "Icon-App-40x40@1x.png": 40,
              "Icon-App-40x40@2x.png": 80,
              "Icon-App-40x40@3x.png": 120,
              "Icon-App-60x60@2x.png": 120,
              "Icon-App-60x60@3x.png": 180,
              "Icon-App-76x76@1x.png": 76,
              "Icon-App-76x76@2x.png": 152,
              "Icon-App-83.5x83.5@2x.png": 167,
              "Icon-App-1024x1024@1x.png": 1024,
          }
          for name, size in icon_sizes.items():
              square(size).save(ios / name, "PNG", optimize=True)

          launch = root / "mobile/ios/Runner/Assets.xcassets/LaunchImage.imageset"
          for name, size in {
              "LaunchImage.png": 256,
              "LaunchImage@2x.png": 512,
              "LaunchImage@3x.png": 768,
          }.items():
              square(size).save(launch / name, "PNG", optimize=True)
          PY
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add mobile/android/app/src/main/res/mipmap-*/ic_launcher.png
          git add mobile/android/app/src/main/res/drawable-nodpi/brand_logo_splash.png
          git add mobile/ios/Runner/Assets.xcassets/AppIcon.appiconset/*.png
          git add mobile/ios/Runner/Assets.xcassets/LaunchImage.imageset/*.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate platform assets from approved logo"
          git push origin HEAD:stage/full-logo-rollout
