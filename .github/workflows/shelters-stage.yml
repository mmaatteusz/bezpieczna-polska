name: Verify PSP shelter stage
on:
  push:
    branches: [main, stage/shelters-psp]
    paths: ['backend/**', 'mobile/**', '.github/workflows/shelters-stage.yml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: shelters-stage-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      TEST_DATABASE_URL: postgresql://test:disposable_ci_only@localhost:5432/test
    steps:
      - uses: actions/checkout@v4
      - name: Import reviewed shelter source payload
        if: hashFiles('shelters-stage.tar.gz') != ''
        run: |
          echo 'd1a0c50e2f610072ea43f9276ac2aecdb5cb0f3d08b4053ac71f32c3800543a3  shelters-stage.tar.gz' | sha256sum --check
          tar -xzf shelters-stage.tar.gz
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend and real PostGIS tests
        working-directory: backend
        run: npm ci && npm run build && npm test
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Mobile verification
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/main.dart lib/model.dart lib/shelters.dart lib/shelter_panel.dart test/model_test.dart test/widget_test.dart test/shelters_test.dart
          dart fix --apply --code=curly_braces_in_flow_control_structures,use_null_aware_elements
          dart format lib/main.dart lib/model.dart lib/shelters.dart lib/shelter_panel.dart test/model_test.dart test/widget_test.dart test/shelters_test.dart
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Fetch real PSP shelter catalog into PostGIS
        working-directory: backend
        run: |
          node --input-type=module <<'JS'
          for (const u of ['https://api.dane.gov.pl/1.4/datasets/28058','https://gdziesieukryc.pl/PS_XML/punkty_schronienia.xml','https://gdziesieukryc.pl/PS_XML/punkty_schronienia.csv']) {
            try {
              const r = await fetch(u,{redirect:'manual',signal:AbortSignal.timeout(20000),headers:{'User-Agent':'BezpiecznaPolska-preview/0.1 (source contract evaluation)','Accept':'text/html,application/xml,application/json,text/csv'}});
              console.log(JSON.stringify({url:u,status:r.status,contentType:r.headers.get('content-type')}));
              if(!r.ok) console.log((await r.text()).slice(0,1000)); else await r.body?.cancel();
            } catch(e) { console.log(JSON.stringify({url:u,error:e.message})); }
          }
          JS
          node scripts/live-shelters.mjs ../docs/validation/shelters
      - uses: actions/upload-artifact@v4
        with:
          name: shelters-live-validation
          path: docs/validation/shelters/shelters-live.json
          if-no-files-found: error
          retention-days: 30
      - name: Save verified implementation
        if: hashFiles('shelters-stage.tar.gz') != ''
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm shelters-stage.tar.gz
          git add backend mobile docs scripts README.md
          git commit -m 'Integrate verified PSP shelter catalog, PostGIS API and existing mobile UI'
          git push origin HEAD:stage/shelters-psp
