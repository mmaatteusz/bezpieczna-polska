name: Verify Android in-place APK update

on:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/configure-preview-signing.sh'
      - 'scripts/android-preview-build-number.sh'
      - 'scripts/verify-preview-apk.sh'
      - '.github/workflows/android-update-compat.yml'
  pull_request:
    branches: [main]
    paths:
      - 'mobile/**'
      - 'scripts/configure-preview-signing.sh'
      - 'scripts/android-preview-build-number.sh'
      - 'scripts/verify-preview-apk.sh'
      - '.github/workflows/android-update-compat.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-update-compat-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
  BP_ENV: preview
  PREVIEW_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL || 'https://api-production-b6560.up.railway.app' }}
  ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
  ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
  ANDROID_PREVIEW_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
  ANDROID_PREVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}

jobs:
  update-in-place:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true

      - name: Configure stable preview signing
        run: bash scripts/configure-preview-signing.sh

      - name: Allocate monotonic preview build numbers
        shell: bash
        run: |
          set -euo pipefail
          BASE_BUILD="$(bash scripts/android-preview-build-number.sh)"
          NEXT_BUILD="$((BASE_BUILD + 1))"
          echo "BASE_BUILD=$BASE_BUILD" >> "$GITHUB_ENV"
          echo "NEXT_BUILD=$NEXT_BUILD" >> "$GITHUB_ENV"
          echo "Testing update $BASE_BUILD -> $NEXT_BUILD" >> "$GITHUB_STEP_SUMMARY"

      - name: Build two signed x86_64 preview APKs
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          flutter pub get
          flutter build apk --debug --target-platform android-x64             --build-number="$BASE_BUILD"             --dart-define=APP_ENV=preview             --dart-define="API_BASE_URL=$PREVIEW_API_BASE_URL"             --dart-define=ENABLE_DEVELOPER_SETTINGS=true
          cp build/app/outputs/flutter-apk/app-debug.apk ../base-preview.apk

          flutter build apk --debug --target-platform android-x64             --build-number="$NEXT_BUILD"             --dart-define=APP_ENV=preview             --dart-define="API_BASE_URL=$PREVIEW_API_BASE_URL"             --dart-define=ENABLE_DEVELOPER_SETTINGS=true
          cp build/app/outputs/flutter-apk/app-debug.apk ../update-preview.apk

      - name: Verify both APK identities before installation
        shell: bash
        run: |
          bash scripts/verify-preview-apk.sh base-preview.apk "$BASE_BUILD" plain
          bash scripts/verify-preview-apk.sh update-preview.apk "$NEXT_BUILD" plain

      - name: Install old APK, update in place, and preserve app data
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -euo pipefail
            PACKAGE=pl.bezpiecznapolska.preview

            adb install base-preview.apk
            adb shell dumpsys package "$PACKAGE" | grep -F "versionCode=$BASE_BUILD"

            adb shell "run-as $PACKAGE sh -c 'mkdir -p files && printf keep-me > files/update-sentinel'"
            test "$(adb shell "run-as $PACKAGE cat files/update-sentinel" | tr -d '\r')" = "keep-me"

            adb install -r update-preview.apk
            adb shell dumpsys package "$PACKAGE" | grep -F "versionCode=$NEXT_BUILD"
            test "$(adb shell "run-as $PACKAGE cat files/update-sentinel" | tr -d '\r')" = "keep-me"

            if adb install -r base-preview.apk; then
              echo "Unexpected downgrade/reinstall to the lower versionCode was accepted" >&2
              exit 1
            fi

            echo "Android PackageManager accepted the signed in-place update and preserved app data." | tee -a "$GITHUB_STEP_SUMMARY"
