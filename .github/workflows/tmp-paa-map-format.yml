name: Temporary PAA map formatter probe
on:
  push:
    branches:
      - hotfix/paa-map-live-refresh
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Format map
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/shelter_map.dart
          git diff -- lib/shelter_map.dart
