name: P0 format debug
on:
  push:
    branches:
      - fix/p0-push-alert-handling
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.4
          cache: true
      - name: Print formatter diff
        run: |
          cd mobile
          dart format lib/main.dart lib/push_notifications.dart test/push_notifications_test.dart
          git diff -- lib/main.dart lib/push_notifications.dart test/push_notifications_test.dart
