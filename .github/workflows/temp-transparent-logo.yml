name: Temporary transparent in-app logo asset

on:
  push:
    branches:
      - stage/in-app-logo-transparent

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/in-app-logo-transparent
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Generate transparent Flutter logo from approved source
        run: |
          python -m pip install --quiet pillow
          python <<'PY'
          from collections import deque
          from pathlib import Path
          from PIL import Image

          src = Path('mobile/assets/brand/bezpieczna_polska_logo.jpg')
          dst = Path('mobile/assets/brand/bezpieczna_polska_logo_transparent.png')

          image = Image.open(src).convert('RGBA')
          px = image.load()
          width, height = image.size

          threshold = 46
          background = bytearray(width * height)
          queue = deque()

          def index(x, y):
              return y * width + x

          def dark_enough(x, y):
              r, g, b, _ = px[x, y]
              return max(r, g, b) <= threshold

          def seed(x, y):
              i = index(x, y)
              if not background[i] and dark_enough(x, y):
                  background[i] = 1
                  queue.append((x, y))

          for x in range(width):
              seed(x, 0)
              seed(x, height - 1)
          for y in range(height):
              seed(0, y)
              seed(width - 1, y)

          while queue:
              x, y = queue.popleft()
              for nx, ny in ((x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)):
                  if nx < 0 or ny < 0 or nx >= width or ny >= height:
                      continue
                  i = index(nx, ny)
                  if background[i] or not dark_enough(nx, ny):
                      continue
                  background[i] = 1
                  queue.append((nx, ny))

          for y in range(height):
              for x in range(width):
                  if background[index(x, y)]:
                      r, g, b, _ = px[x, y]
                      px[x, y] = (r, g, b, 0)

          # Feather only the immediate dark JPEG fringe next to removed background.
          for _ in range(2):
              changes = []
              for y in range(1, height - 1):
                  for x in range(1, width - 1):
                      r, g, b, a = px[x, y]
                      if a == 0 or max(r, g, b) > 82:
                          continue
                      if any(px[nx, ny][3] == 0 for nx, ny in (
                          (x - 1, y), (x + 1, y), (x, y - 1), (x, y + 1)
                      )):
                          alpha = max(0, min(255, round((max(r, g, b) - 35) / 47 * 255)))
                          changes.append((x, y, (r, g, b, alpha)))
              for x, y, value in changes:
                  px[x, y] = value

          dst.parent.mkdir(parents=True, exist_ok=True)
          image.save(dst, optimize=True)

          alpha = image.getchannel('A')
          lo, hi = alpha.getextrema()
          if lo != 0 or hi != 255:
              raise SystemExit(f'Unexpected alpha range: {(lo, hi)}')
          if image.getpixel((0, 0))[3] != 0:
              raise SystemExit('Background removal failed at top-left corner')
          print(f'Generated {dst} at {width}x{height} with transparent background')
          PY
      - name: Commit generated asset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/assets/brand/bezpieczna_polska_logo_transparent.png
          git commit -m "Add transparent in-app logo asset"
          git push origin HEAD:stage/in-app-logo-transparent
