name: Build preview APK and offline regression
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-apk-offline-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:disposable_ci_only@localhost:5432/test
      PREVIEW_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL || 'https://api-production-b6560.up.railway.app' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
      ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
      ANDROID_PREVIEW_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
      ANDROID_PREVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build and full tests
        working-directory: backend
        run: npm ci && npm run build && npm test
      - name: Verify displayed mobile version
        run: node scripts/sync-mobile-version.mjs --check
      - name: Seed persistent PostGIS state
        working-directory: backend
        run: node scripts/ua-postgis-restart.mjs seed
      - name: Restart actual PostGIS service
        run: |
          docker restart ${{ job.services.postgis.id }}
          for i in $(seq 1 30); do
            if docker exec ${{ job.services.postgis.id }} pg_isready -U test -d test; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Verify persistence after database and backend process restart
        working-directory: backend
        run: node scripts/ua-postgis-restart.mjs verify

      - name: Live RCB contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-rcb.mjs ../output/rcb
      - name: Live Ukraine source contract
        continue-on-error: true
        working-directory: backend
        env:
          UKRAINE_ALARM_API_KEY: ${{ secrets.UKRAINE_ALARM_API_KEY }}
        run: node scripts/live-ukraine.mjs ../output/ukraine-live.json
      - name: Live Police and PSP incident contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-service-incidents.mjs ../output/service-incidents-live.json

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter format, analyze and full tests
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
          mkdir -p ../output/formatter
          cp lib/push_notifications.dart test/push_notifications_test.dart lib/offline_packages.dart lib/offline_repository.dart lib/offline_data_screen.dart test/offline_packages_test.dart pubspec.lock ../output/formatter/
          git diff --exit-code -- lib test pubspec.lock
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Assert offline package contract
        working-directory: mobile
        run: flutter test --no-pub test/offline_packages_test.dart
      - name: Assert NEPTUN historical safety contract
        working-directory: backend
        run: node --import tsx --test test/neptun.test.ts
      - name: Assert push notification contract
        working-directory: backend
        run: node --import tsx --test test/push.test.ts
      - name: Configure stable preview signing
        shell: bash
        run: |
          set -euo pipefail
          for key in ANDROID_PREVIEW_KEYSTORE_B64 ANDROID_PREVIEW_KEYSTORE_PASSWORD ANDROID_PREVIEW_KEY_ALIAS ANDROID_PREVIEW_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "Missing required GitHub secret: $key" >&2
              exit 1
            fi
          done
          echo "$ANDROID_PREVIEW_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/preview-signing.jks"
          echo "ANDROID_PREVIEW_KEYSTORE_PATH=$RUNNER_TEMP/preview-signing.jks" >> "$GITHUB_ENV"
          keytool -list -keystore "$RUNNER_TEMP/preview-signing.jks" -storepass "$ANDROID_PREVIEW_KEYSTORE_PASSWORD" -alias "$ANDROID_PREVIEW_KEY_ALIAS" >/dev/null
      - name: Build Android preview
        working-directory: mobile
        run: >-
          flutter build apk --debug --split-per-abi --target-platform android-arm64
          --dart-define=APP_ENV=preview
          --dart-define="API_BASE_URL=$PREVIEW_API_BASE_URL"
          --dart-define=ENABLE_DEVELOPER_SETTINGS=true
          --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
          --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"

      - name: Live RSO contract check
        working-directory: backend
        continue-on-error: true
        run: node scripts/live-rso.mjs ../output/rso-live.json

      - name: Live WCZK contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-wczk.mjs ../output/wczk-live.json
      - name: Live IMGW warnings contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-imgw.mjs ../output/imgw-live.json
      - name: Live PAA communication contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-paa.mjs ../output/paa-live.json
      - name: Live CERT and CSIRT GOV contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-cyber.mjs ../output/cyber-live.json
      - name: Live Straż Graniczna contract check
        continue-on-error: true
        working-directory: backend
        run: node scripts/live-sg.mjs ../output/sg-live.json

      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          VERSION="$(node -p "require('./backend/package.json').version")"
          BUILD="$(sed -nE 's/^version: [^+]+\+([0-9]+)$/\1/p' mobile/pubspec.yaml)"
          EXPECTED_CODE="$((2000 + BUILD))"
          cp mobile/pubspec.lock output/pubspec.lock.resolved
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk "output/Bezpieczna_Polska_${VERSION}-preview-arm64.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs output/*.apk | tee output/signature-check.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/*.apk > output/package-info.txt
          grep -F "native-code: 'arm64-v8a'" output/package-info.txt
          if grep -E "native-code:.*(armeabi-v7a|x86_64)" output/package-info.txt; then
            echo "Unexpected non-arm64 native libraries in arm64 preview APK" >&2
            exit 1
          fi
          grep -F "versionName='${VERSION}'" output/package-info.txt
          grep -F "versionCode='${EXPECTED_CODE}'" output/package-info.txt
          grep -F "name='pl.bezpiecznapolska.preview'" output/package-info.txt
          grep -F "sdkVersion:'24'" output/package-info.txt
          grep -F "targetSdkVersion:'36'" output/package-info.txt
          grep -F "Verified using v2 scheme (APK Signature Scheme v2): true" output/signature-check.txt
          sha256sum output/*.apk | tee output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Bezpieczna_Polska_preview_offline_regression
          path: output/
          if-no-files-found: warn
          retention-days: 30
