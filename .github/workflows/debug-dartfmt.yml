name: Debug dart format diff
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Format target file
        working-directory: mobile
        run: dart format lib/shelter_map.dart
      - name: Upload formatted file
        uses: actions/upload-artifact@v7
        with:
          name: formatted-shelter-map
          path: mobile/lib/shelter_map.dart
          if-no-files-found: error
