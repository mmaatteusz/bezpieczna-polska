name: Complete signed beta.3 Google Play bundle

on:
  push:
    branches: [stage/play-beta3]
    paths: [.github/workflows/complete-play-beta3.yml, docs/PRIVACY_POLICY.md]

permissions:
  contents: write
  actions: read

concurrency:
  group: complete-play-beta3
  cancel-in-progress: false

jobs:
  play-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      GH_TOKEN: ${{ github.token }}
      BP_ENV: production
      RELEASE_SHA: ea026d5a64a3cea8da98952a5637d252f1b42fe8
      VERSION: 0.1.0-beta.3
      API_BASE_URL: https://bezpieczna-polska-api.duckdns.org
      BACKEND_SHA: 12acc0cf1eed19b2eb1b1b13116f82fde8991bb1
      BACKEND_VERSION: 0.1.0-beta.2
      PRIVACY_POLICY_URL: https://github.com/mmaatteusz/bezpieczna-polska/blob/${{ github.sha }}/docs/PRIVACY_POLICY.md
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PRODUCTION_SIGNING_CERT_SHA256: ${{ vars.PRODUCTION_SIGNING_CERT_SHA256 }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_PRODUCTION_ANDROID_APP_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ea026d5a64a3cea8da98952a5637d252f1b42fe8
          fetch-depth: 0
      - name: Verify the already published source and successful main gates
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          git merge-base --is-ancestor "$RELEASE_SHA" origin/main
          for id in 37424741224 37424741233; do
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" | jq -e --arg sha "$RELEASE_SHA" '.head_sha == $sha and .head_branch == "main" and .event == "push" and .conclusion == "success"'
          done
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/release.json"
          jq -e --arg sha "$RELEASE_SHA" '.target_commitish == $sha and .draft == false and any(.assets[]; .name == "Bezpieczna_Polska_0.1.0-beta.3_arm64.apk" and .digest == "sha256:65bfe168734f240dc6d3306883f2fb41e09c80d0b331648d0cef1ec7c3536c03") and all(.assets[]; (.name | endswith(".aab")) | not)' "$RUNNER_TEMP/release.json"
      - name: Require existing production signing, Firebase and privacy configuration
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for key in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD PRODUCTION_SIGNING_CERT_SHA256 FIREBASE_API_KEY FIREBASE_PROJECT_ID FIREBASE_MESSAGING_SENDER_ID FIREBASE_ANDROID_APP_ID PRIVACY_POLICY_URL; do
            if [[ -z "${!key}" ]]; then echo "::error::Missing production configuration: $key"; missing=1; fi
          done
          test "$missing" = 0
          [[ "$PRODUCTION_SIGNING_CERT_SHA256" =~ ^[a-f0-9]{64}$ ]]
          [[ "$FIREBASE_ANDROID_APP_ID" == "1:${FIREBASE_MESSAGING_SENDER_ID}:android:"* ]]
          [[ "$FIREBASE_ANDROID_APP_ID" != '1:286214663598:android:3d9689cd9f636399ffac3f' ]]
          [[ "$PRIVACY_POLICY_URL" == https://* ]]
          curl -fsSL --proto '=https' --proto-redir '=https' --max-time 20 \
            --output "$RUNNER_TEMP/privacy.html" --write-out '%{content_type}' \
            "$PRIVACY_POLICY_URL" > "$RUNNER_TEMP/privacy-type.txt"
          grep -Eiq '^text/html([;[:space:]]|$)' "$RUNNER_TEMP/privacy-type.txt"
          test -s "$RUNNER_TEMP/privacy.html"
          grep -Fq "mati66628@gmail.com" "$RUNNER_TEMP/privacy.html"
          grep -Fq "Mateusz Kawczyński" "$RUNNER_TEMP/privacy.html"
          if grep -Fq '[DO UZUPEŁNIENIA' "$RUNNER_TEMP/privacy.html"; then
            echo '::error::Privacy policy still contains unfilled draft fields.'; exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify release identity and monotonic production version code
        run: |
          node scripts/sync-mobile-version.mjs --check
          node scripts/check-production-version-history.mjs
          BUILD="$(sed -nE 's/^version: [^+]+\+([0-9]+)$/\1/p' mobile/pubspec.yaml)"
          test -n "$BUILD"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Install and verify the existing production key
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          cert="$(keytool -exportcert -keystore "$RUNNER_TEMP/release.jks" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD -alias "$ANDROID_KEY_ALIAS" | sha256sum | awk '{print $1}')"
          test "$cert" = "$PRODUCTION_SIGNING_CERT_SHA256"
      - name: Build signed Play test bundle against the verified live backend
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS --max-time 20 "$API_BASE_URL/health")"
          jq -e --arg sha "$BACKEND_SHA" --arg version "$BACKEND_VERSION" \
            '.ok == true and .environment == "production" and .buildSha == $sha and .version == $version' <<<"$health"
          # A client-only beta may use an older compatible, contract-tested API.
          # The normal production release gate still requires an exact version.
          test "${BACKEND_VERSION%%-*}" = "${VERSION%%-*}"
          flutter pub get
          flutter build appbundle --release \
            --dart-define=APP_ENV=production --dart-define="APP_VERSION=$VERSION" \
            --dart-define=APP_CHANNEL=production --dart-define="APP_BUILD_NUMBER=$BUILD" \
            --dart-define="API_BASE_URL=$API_BASE_URL" --dart-define="PRIVACY_POLICY_URL=$PRIVACY_POLICY_URL" \
            --dart-define=ENABLE_DEVELOPER_SETTINGS=false \
            --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY" --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID" \
            --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
      - name: Verify AAB signature, structure and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir play
          cp mobile/build/app/outputs/bundle/release/app-release.aab "play/Bezpieczna_Polska_${VERSION}_Google_Play.aab"
          jarsigner -verify -strict -keystore "$ANDROID_KEYSTORE_PATH" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD play/*.aab "$ANDROID_KEY_ALIAS" | tee play/aab-signature-check.txt
          curl -fsSL --max-time 60 https://github.com/google/bundletool/releases/download/1.18.2/bundletool-all-1.18.2.jar -o "$RUNNER_TEMP/bundletool.jar"
          echo "378b5434cd1378bef6b2bc527b8c7f0ff2584b273830335bce54d6d0813c8584  $RUNNER_TEMP/bundletool.jar" | sha256sum --check
          java -jar "$RUNNER_TEMP/bundletool.jar" validate --bundle="play/Bezpieczna_Polska_${VERSION}_Google_Play.aab" > play/aab-validation.txt
          java -jar "$RUNNER_TEMP/bundletool.jar" dump manifest --bundle="play/Bezpieczna_Polska_${VERSION}_Google_Play.aab" > play/aab-manifest.xml
          python - <<'PY'
          import os, xml.etree.ElementTree as ET
          root = ET.parse('play/aab-manifest.xml').getroot()
          android = '{http://schemas.android.com/apk/res/android}'
          assert root.attrib['package'] == 'pl.bezpiecznapolska'
          assert root.attrib[android + 'versionName'] == os.environ['VERSION']
          assert root.attrib[android + 'versionCode'] == os.environ['BUILD']
          assert root.find('uses-sdk').attrib[android + 'targetSdkVersion'] == '36'
          PY
          printf 'Package: pl.bezpiecznapolska\nVersion: %s\nSource commit: %s\nBackend: %s (%s)\nSigner SHA256: %s\nFirebase Android app: %s\nPrivacy policy: %s\n' \
            "$VERSION" "$RELEASE_SHA" "$BACKEND_VERSION" "$BACKEND_SHA" "$PRODUCTION_SIGNING_CERT_SHA256" "$FIREBASE_ANDROID_APP_ID" "$PRIVACY_POLICY_URL" > play/play-build-info.txt
          (cd play && sha256sum *.aab > AAB_SHA256SUMS.txt)
      - uses: actions/upload-artifact@v7
        with:
          name: Bezpieczna_Polska_Play_bundle
          path: play/
          if-no-files-found: error
      - name: Remove temporary production key
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
      - name: Attach the verified AAB to beta.3 without replacing APK assets
        shell: bash
        run: |
          set -euo pipefail
          (cd play && sha256sum --check AAB_SHA256SUMS.txt)
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" > "$RUNNER_TEMP/current-release.json"
          jq -e --arg sha "$RELEASE_SHA" '.target_commitish == $sha and .draft == false and any(.assets[]; .name == "Bezpieczna_Polska_0.1.0-beta.3_arm64.apk" and .digest == "sha256:65bfe168734f240dc6d3306883f2fb41e09c80d0b331648d0cef1ec7c3536c03") and all(.assets[]; (.name | endswith(".aab")) | not)' "$RUNNER_TEMP/current-release.json"
          gh release upload "v$VERSION" play/* --repo "$GITHUB_REPOSITORY"
          python - <<'PYBODY'
          import json, os, re
          from pathlib import Path
          release=json.loads(Path(os.environ['RUNNER_TEMP']+'/current-release.json').read_text())
          body=release['body']
          body=re.sub(r'\n## Pakiet Google Play\n\nBuild podpisanego AAB[^\n]*\n', '\n', body)
          body+='\n## Podpisany pakiet Google Play\n\nDołączono `Bezpieczna_Polska_0.1.0-beta.3_Google_Play.aab` do testów Play Console: pakiet `pl.bezpiecznapolska`, versionCode `80`, istniejący podpis produkcyjny i produkcyjna aplikacja Firebase. Podpis, struktura i manifest zostały zweryfikowane.\n\nPolityka prywatności: '+os.environ['PRIVACY_POLICY_URL']+'\n\nBuild i weryfikacja AAB: https://github.com/'+os.environ['GITHUB_REPOSITORY']+'/actions/runs/'+os.environ['GITHUB_RUN_ID']+'\n'
          Path(os.environ['RUNNER_TEMP']+'/play-release-notes.md').write_text(body)
          PYBODY
          gh release edit "v$VERSION" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/play-release-notes.md"
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" | jq -e 'any(.assets[]; .name == "Bezpieczna_Polska_0.1.0-beta.3_Google_Play.aab")'
