name: Format NEPTUN hotfix

on:
  push:
    branches:
      - hotfix/neptun-marker-details

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: hotfix/neptun-marker-details
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Format NEPTUN file
        run: |
          cd mobile
          dart format lib/neptun.dart
          cd ..
          if git diff --quiet -- mobile/lib/neptun.dart; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/neptun.dart
          git commit -m "Format NEPTUN hotfix"
          git push
