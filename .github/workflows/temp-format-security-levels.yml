name: Temp format security levels

on:
  push:
    branches:
      - stage/security-levels-ui

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: stage/security-levels-ui
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
      - name: Resolve and format
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/security_levels.dart
      - name: Commit formatter output
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/security_levels.dart
          git commit -m "Style: format security levels with package context"
          git push origin HEAD:stage/security-levels-ui
