name: Build preview APK and source live checks
on:
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'docs/**'
      - '.github/workflows/preview-apk.yml'
  push:
    branches: ['stage/**']
    paths:
      - 'backend/**'
      - 'mobile/**'
      - 'docs/**'
      - '.github/workflows/preview-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: preview-apk-${{ github.ref }}
  cancel-in-progress: true
env:
  CI: 'true'
  FLUTTER_SUPPRESS_ANALYTICS: 'true'
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgis:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:disposable_ci_only@localhost:5432/test
      BP_ENV: preview
      PREVIEW_API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL || 'https://api-production-b6560.up.railway.app' }}
      FIREBASE_API_KEY: ${{ vars.FIREBASE_API_KEY }}
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_MESSAGING_SENDER_ID }}
      FIREBASE_ANDROID_APP_ID: ${{ vars.FIREBASE_ANDROID_APP_ID }}
      ANDROID_PREVIEW_KEYSTORE_B64: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_B64 }}
      ANDROID_PREVIEW_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEYSTORE_PASSWORD }}
      ANDROID_PREVIEW_KEY_ALIAS: ${{ secrets.ANDROID_PREVIEW_KEY_ALIAS }}
      ANDROID_PREVIEW_KEY_PASSWORD: ${{ secrets.ANDROID_PREVIEW_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Backend build and tests
        working-directory: backend
        run: npm ci && npm run build && npm test
      - name: Live official-source smoke checks
        working-directory: backend
        continue-on-error: true
        env:
          UKRAINE_ALARM_API_KEY: ${{ secrets.UKRAINE_ALARM_API_KEY }}
        run: |
          mkdir -p ../output
          for source in rcb rso wczk imgw paa cyber sg service-incidents ukraine; do
            node "scripts/live-$source.mjs" "../output/$source-live.json" || echo "$source unavailable: contract tests remain authoritative"
          done
      - name: Required live NEPTUN contracts
        working-directory: backend
        run: |
          mkdir -p ../output
          node scripts/live-neptun.mjs ../output/neptun-live.json
          node scripts/live-neptun-api.mjs ../output/neptun-api-live.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Flutter dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Flutter format check
        working-directory: mobile
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Flutter analyze
        working-directory: mobile
        run: flutter analyze --no-pub
      - name: Flutter tests
        working-directory: mobile
        run: flutter test --no-pub --reporter expanded
      - name: Configure stable preview signing
        run: bash scripts/configure-preview-signing.sh
      - name: Allocate monotonic preview versionCode
        shell: bash
        run: echo "PREVIEW_BUILD_NUMBER=$(bash scripts/android-preview-build-number.sh)" >> "$GITHUB_ENV"
      - name: Build Android preview
        working-directory: mobile
        run: >-
          flutter build apk --debug --split-per-abi --target-platform android-arm64 --build-number="$PREVIEW_BUILD_NUMBER"
          --dart-define=APP_ENV=preview
          --dart-define="API_BASE_URL=$PREVIEW_API_BASE_URL"
          --dart-define=ENABLE_DEVELOPER_SETTINGS=false
          --dart-define="FIREBASE_API_KEY=$FIREBASE_API_KEY"
          --dart-define="FIREBASE_PROJECT_ID=$FIREBASE_PROJECT_ID"
          --dart-define="FIREBASE_MESSAGING_SENDER_ID=$FIREBASE_MESSAGING_SENDER_ID"
          --dart-define="FIREBASE_ANDROID_APP_ID=$FIREBASE_ANDROID_APP_ID"
      - name: Prepare artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          VERSION="$(node -p "require('./backend/package.json').version")"
          cp mobile/build/app/outputs/flutter-apk/app-arm64-v8a-debug.apk output/Bezpieczna_Polska_preview_arm64.apk
          bash scripts/verify-preview-apk.sh $(find output -maxdepth 1 -name '*.apk' -print -quit) "$PREVIEW_BUILD_NUMBER" split-arm64
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs output/*.apk | tee output/signature-check.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging output/*.apk > output/package-info.txt
          grep -F "native-code: 'arm64-v8a'" output/package-info.txt
          if grep -E "native-code:.*(armeabi-v7a|x86_64)" output/package-info.txt; then
            echo "Unexpected non-arm64 native libraries in arm64 preview APK" >&2
            exit 1
          fi
          grep -F "versionName='${VERSION}'" output/package-info.txt
          grep -F "name='pl.bezpiecznapolska.preview'" output/package-info.txt
          sha256sum output/*.apk | tee output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v7
        with:
          name: Bezpieczna_Polska_preview_arm64
          path: output/
          if-no-files-found: error
          retention-days: 30
