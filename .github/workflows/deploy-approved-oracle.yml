name: Roll out approved Oracle release
on:
  push:
    branches: [main]
permissions:
  contents: read
  actions: write
jobs:
  deploy:
    if: contains(github.event.head_commit.message, '[deploy-oracle]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_SHA: ${{ github.sha }}
      API_BASE_URL: ${{ vars.PREVIEW_API_BASE_URL }}
    steps:
      - uses: actions/checkout@v7
      - name: Request exact approved main deployment
        shell: bash
        run: |
          set -euo pipefail
          test -n "$API_BASE_URL"
          gh workflow run oracle-deploy.yml --ref main -f "target_sha=$TARGET_SHA" -f "api_base_url=$API_BASE_URL"
