name: Format debug
on:
  pull_request:
    branches: [main]
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show formatter patch after pub get
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib/shelter_map.dart test/push_notifications_test.dart test/widget_test.dart
          git diff -- lib/shelter_map.dart test/push_notifications_test.dart test/widget_test.dart
