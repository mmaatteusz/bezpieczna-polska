name: Format debug
on:
  push:
    branches: ['fix/source-status-technical-vs-coverage']
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Show dart format diff
        working-directory: mobile
        shell: bash
        run: |
          set -euo pipefail
          dart format lib test
          git diff -- lib/source_status.dart test/source_status_test.dart
