name: One-shot format quality pass
on:
  push:
    branches: [stage/quality-pass]
    paths: ['.github/workflows/format-quality-pass.yml']
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage/quality-pass
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Resolve Flutter packages
        working-directory: mobile
        run: flutter pub get
      - name: Format changed Dart sources
        shell: bash
        run: |
          set -euo pipefail
          dart format mobile/lib/main.dart mobile/lib/model.dart mobile/lib/shelters.dart mobile/lib/shelter_panel.dart mobile/test/shelters_test.dart
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mobile/lib/main.dart mobile/lib/model.dart mobile/lib/shelters.dart mobile/lib/shelter_panel.dart mobile/test/shelters_test.dart
          git commit -m "Format Dart after Flutter package resolution"
          git push origin HEAD:stage/quality-pass
