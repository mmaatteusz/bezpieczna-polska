name: Repository branch hygiene

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - 'scripts/repository-branch-hygiene*'
      - 'scripts/repository-obsolete-branches.json'
      - '.github/workflows/repository-branch-hygiene.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: repository-branch-hygiene-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - run: node --test scripts/repository-branch-hygiene.test.mjs
  prune:
    needs: verify
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Remove completed branches while preserving active work
        uses: actions/github-script@v7
        with:
          script: |
            const {runBranchHygiene} = await import(`${process.env.GITHUB_WORKSPACE}/scripts/repository-branch-hygiene.mjs`);
            const {readFileSync} = await import('node:fs');
            const obsoleteHeads = JSON.parse(readFileSync(`${process.env.GITHUB_WORKSPACE}/scripts/repository-obsolete-branches.json`, 'utf8'));
            await runBranchHygiene({github, context, core, obsoleteHeads});
