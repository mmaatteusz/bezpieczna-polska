services:
  gateway:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set the domain pointing to this host}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [api]
volumes:
  caddy-data:
  caddy-config:
