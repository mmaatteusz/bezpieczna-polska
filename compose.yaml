services:
  database:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: bezpieczna
      POSTGRES_USER: bezpieczna
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    volumes: ['postgres-data:/var/lib/postgresql/data']
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bezpieczna -d bezpieczna']
      interval: 10s
      retries: 5
  migrate:
    build: ./backend
    command: ['node', 'dist/migrate.js']
    depends_on:
      database:
        condition: service_healthy
    environment: &api-env
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL connection URL}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set random admin token}
      APP_ENV: production
      NODE_ENV: production
      TRUST_PROXY: 'true'
      BUILD_SHA: ${BUILD_SHA:?Set deployed commit SHA}
      PUBLIC_BASE_URL: https://${API_DOMAIN:?Set public domain}
    restart: 'no'
  api:
    build: ./backend
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports: ['127.0.0.1:8080:8080']
    environment:
      <<: *api-env
      ENABLE_INGESTION: 'true'
    restart: unless-stopped
  backup:
    image: postgis/postgis:17-3.5
    entrypoint: ['/bin/bash','-c','while true; do bash /scripts/backup.sh; sleep 86400; done']
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set PostgreSQL connection URL}
      BACKUP_DIR: /backups
      BACKUP_KEEP_DAYS: '14'
    volumes:
      - ./backend/scripts:/scripts:ro
      - backups-data:/backups
    restart: unless-stopped
volumes:
  postgres-data:
  backups-data:
